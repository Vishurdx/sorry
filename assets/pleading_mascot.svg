<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9d2"/>
      <stop offset="100%" stop-color="#ffb3c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e91e63" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <g filter="url(#softGlow)">
    <!-- Aura halo -->
    <circle cx="120" cy="120" r="95" fill="url(#sparkleGrad)" opacity="0.6"/>

    <!-- Bear Body -->
    <ellipse cx="120" cy="155" rx="55" ry="46" fill="#f8ede3" stroke="#e0bc9e" stroke-width="4"/>
    <ellipse cx="120" cy="160" rx="36" ry="30" fill="#ffffff"/>

    <!-- Bear Ears -->
    <circle cx="82" cy="72" r="22" fill="#f8ede3" stroke="#e0bc9e" stroke-width="4"/>
    <circle cx="82" cy="72" r="12" fill="#ffb3c6"/>
    <circle cx="158" cy="72" r="22" fill="#f8ede3" stroke="#e0bc9e" stroke-width="4"/>
    <circle cx="158" cy="72" r="12" fill="#ffb3c6"/>

    <!-- Bear Head -->
    <ellipse cx="120" cy="112" rx="58" ry="48" fill="#f8ede3" stroke="#e0bc9e" stroke-width="4"/>

    <!-- Big Sparkly Anime Pleading Eyes -->
    <!-- Left Eye -->
    <ellipse cx="98" cy="108" rx="15" ry="19" fill="#2d1c24"/>
    <ellipse cx="98" cy="104" rx="13" ry="12" fill="#4d2938"/>
    <circle cx="94" cy="101" r="6.5" fill="#ffffff"/>
    <circle cx="103" cy="113" r="3.5" fill="#ffffff"/>
    <circle cx="93" cy="117" r="1.8" fill="#ffffff"/>
    
    <!-- Right Eye -->
    <ellipse cx="142" cy="108" rx="15" ry="19" fill="#2d1c24"/>
    <ellipse cx="142" cy="104" rx="13" ry="12" fill="#4d2938"/>
    <circle cx="138" cy="101" r="6.5" fill="#ffffff"/>
    <circle cx="147" cy="113" r="3.5" fill="#ffffff"/>
    <circle cx="137" cy="117" r="1.8" fill="#ffffff"/>

    <!-- Sad/Pleading Eyebrows -->
    <path d="M 85 86 Q 98 80 110 88" fill="none" stroke="#6b4435" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 130 88 Q 142 80 155 86" fill="none" stroke="#6b4435" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="80" cy="122" rx="14" ry="8" fill="#ff8ba7" opacity="0.75"/>
    <ellipse cx="160" cy="122" rx="14" ry="8" fill="#ff8ba7" opacity="0.75"/>

    <!-- Snout & Mouth -->
    <ellipse cx="120" cy="122" rx="15" ry="11" fill="#ffffff"/>
    <path d="M 120 118 L 116 114 A 3 3 0 0 1 124 114 Z" fill="#4a2e22"/>
    <path d="M 115 124 Q 120 120 120 119 Q 120 120 125 124" fill="none" stroke="#4a2e22" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pleading Finger Poking Gesture (👉👈) -->
    <g transform="translate(120, 155)">
      <!-- Left paw pointing right -->
      <ellipse cx="-20" cy="0" rx="12" ry="9" fill="#f8ede3" stroke="#e0bc9e" stroke-width="3"/>
      <path d="M -10 0 L -2 0" stroke="#e0bc9e" stroke-width="5" stroke-linecap="round"/>
      <!-- Right paw pointing left -->
      <ellipse cx="20" cy="0" rx="12" ry="9" fill="#f8ede3" stroke="#e0bc9e" stroke-width="3"/>
      <path d="M 10 0 L 2 0" stroke="#e0bc9e" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Floating broken heart healing with bandage -->
    <g transform="translate(185, 55) scale(0.7)">
      <path d="M 0 15 C 0 0, -25 0, -25 20 C -25 40, 0 60, 0 68 C 0 60, 25 40, 25 20 C 25 0, 0 0, 0 15 Z" fill="#ff4d79"/>
      <!-- Tiny bandage -->
      <rect x="-14" y="24" width="28" height="8" rx="3" fill="#ffe0b2" transform="rotate(-20)"/>
    </g>

    <!-- Tiny flower on head -->
    <circle cx="70" cy="55" r="7" fill="#ffeb3b"/>
    <circle cx="70" cy="55" r="3" fill="#ff9800"/>
  </g>
</svg>

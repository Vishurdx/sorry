<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="cryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#cryShadow)">
    <!-- Round Mochi / Chibi Character -->
    <ellipse cx="100" cy="100" rx="65" ry="58" fill="#fffaf5" stroke="#f2829b" stroke-width="4"/>
    <!-- Cute Dramatic Waterfall Tears -->
    <path d="M 65 95 C 40 100, 30 140, 20 160 C 25 155, 45 130, 68 108 Z" fill="#6bc5f8" opacity="0.85"/>
    <path d="M 135 95 C 160 100, 170 140, 180 160 C 175 155, 155 130, 132 108 Z" fill="#6bc5f8" opacity="0.85"/>
    <!-- Tiny tear splash -->
    <ellipse cx="20" cy="165" rx="10" ry="4" fill="#6bc5f8" opacity="0.7"/>
    <ellipse cx="180" cy="165" rx="10" ry="4" fill="#6bc5f8" opacity="0.7"/>
    <!-- Closed Crying Eyes > < -->
    <path d="M 55 88 L 72 95 L 55 102" fill="none" stroke="#442a32" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 145 88 L 128 95 L 145 102" fill="none" stroke="#442a32" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Blush -->
    <ellipse cx="58" cy="112" rx="12" ry="7" fill="#ffb3c6" opacity="0.8"/>
    <ellipse cx="142" cy="112" rx="12" ry="7" fill="#ffb3c6" opacity="0.8"/>
    <!-- Open Wailing Mouth -->
    <path d="M 85 110 Q 100 135 115 110 Z" fill="#e04f6e" stroke="#442a32" stroke-width="2.5"/>
    <ellipse cx="100" cy="120" rx="8" ry="5" fill="#ff8da1"/>
    <!-- Pleading Paws -->
    <ellipse cx="80" cy="142" rx="11" ry="9" fill="#ffffff" stroke="#f2829b" stroke-width="3"/>
    <ellipse cx="120" cy="142" rx="11" ry="9" fill="#ffffff" stroke="#f2829b" stroke-width="3"/>
    <text x="100" y="184" text-anchor="middle" fill="#d93b68" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold">Forgive me please! 😭</text>
  </g>
</svg>
